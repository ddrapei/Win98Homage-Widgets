; ===========================================================================
;  Win98 Resource Meter  --  Rainmeter skin  (v1.2)
;  CPU and memory usage as the chunky segmented bars of a Win98 progress
;  dialog.  Sibling of the Win98 Date/Time skin: same warm golden /
;  orange-brown scheme, same chrome, same dialog width -- just shorter.
;  Skin.lua must sit in this folder.
;
;  Structure:
;    Variables      palette, layout knobs, Lua-written state
;    Measures       the script, CPU, physical memory
;    Styles         shared text options
;    Chrome         frame, title bar, icon, title, buttons
;    Gauges         one etched group box per gauge, the legend on its edge --
;                   the sibling's usage-panel treatment -- holding an info
;                   row, the trough, the blocks, and the cover that hides
;                   the unfilled tail
;
;  Performance: every block of both bars is static, outlines and all -- the
;  bars are painted full, and Skin.lua erases the unfilled tail of each with
;  a single field-coloured rectangle.  The cover moves in whole blocks (32
;  per bar), so a steady load costs no repaint at all; per-second work is
;  two measure reads and the Lua tick.
; ===========================================================================

[Rainmeter]
Update=1000
AccurateText=1
MouseActionCursor=0

[Metadata]
Name=Win98 Resource Meter
Information=Pixel reconstruction of a Windows 98 resource dialog.|CPU and memory usage as segmented progress bars.
Version=1.2
License=Do what you like with it

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole dialog, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextAA=0
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the Win98 Date/Time skin: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208
UseInk=170,78,28

; --- gauges ----------------------------------------------------------------
; The bars' block runs: first block at BarX, all blocks together BarW wide,
; BarH rows tall, CPU at CpuY and memory at RamY.  Each gauge sits in its
; own etched group box, the sibling's usage-panel treatment: legend on the
; edge, info row inside, then the trough.  The static boxes and blocks below
; are drawn to match these figures, so change them together.
BarX=31
BarW=318
BarH=16
CpuY=58
RamY=124

; --- written by Skin.lua ---------------------------------------------------
; the cover that erases the unfilled tail of each bar, as one shape, the
; info line of each gauge, and nothing else.  The cover defaults hide
; everything: without the script the bars read empty, not full
CpuCover=Rectangle 29,58,322,16 | Fill Color #FieldBg# | StrokeWidth 0
RamCover=Rectangle 29,124,322,16 | Fill Color #FieldBg# | StrokeWidth 0
CpuInfo=
RamInfo=

[MeasureCpu]
Measure=CPU

[MeasureRam]
Measure=PhysicalMemory

[MeasureSkin]
Measure=Script
ScriptFile=#CURRENTPATH#Skin.lua

[StyleText]
; every string meter inherits this
FontFace=#Font#
FontSize=#FontSize#
FontColor=#Ink#
AntiAlias=#TextAA#
ClipString=0
UpdateDivider=-1
DynamicVariables=1

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 0,0,(380 + 2 * #Pad#),(159 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

