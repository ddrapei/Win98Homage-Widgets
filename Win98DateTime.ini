; ---------------------------------------------------------------------------
;  Measures.  Order matters: the script reads the two probes below, and
;  measures are updated in the order they are defined.
; ---------------------------------------------------------------------------

[MeasureLockScreen]
; LogonUI.exe is the lock screen / sign-in UI, and it runs only while the
; workstation is locked.  Reads 1 when locked, -1 when not.  Needs no
; elevation, unlike reading lock events out of the security log.
Measure=Process
ProcessName=LogonUI.exe
UpdateDivider=2

[MeasureLogon]
; When this user signed in, in seconds since 1601-01-01.  Used once, at load,
; so a skin that starts with Windows dates the session from the sign-in rather
; than from whenever Rainmeter got around to starting.
Measure=SysInfo
SysInfoType=USER_LOGONTIME
UpdateDivider=-1

[MeasureSkin]
Measure=Script
ScriptFile=#CURRENTPATH#Skin.lua

[StyleText]
; every string meter inherits this
FontFace=#Font#
FontSize=#FontSize#
FontColor=#Ink#
AntiAlias=#TextAA#
ClipString=0
UpdateDivider=-1
DynamicVariables=1

[StyleDatePage]
; belongs to the Date & Time page
Hidden=#Page#
UpdateDivider=-1
DynamicVariables=1

[StyleTzPage]
; belongs to the Time Zone page
Hidden=(1 - #Page#)
UpdateDivider=-1
DynamicVariables=1

[StyleHit]
; invisible click target: alpha 1 (alpha 0 would not be mouse-detectable)
UpdateDivider=-1
DynamicVariables=1

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 0,0,(380 + 2 * #Pad#),(365 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

