; ===========================================================================
;  Win98 Date/Time Properties  --  Rainmeter skin  (v4.1)
;  Calendar shows the selected date (defaults to today), clock shows now, and
;  the bottom panel shows when this computer was on and unlocked that day.
;  Warm golden / orange-brown scheme.  Skin.lua must sit in this folder.
;
;  Structure:
;    Variables      palette, layout knobs, Lua-written state
;    Measures       the script, the lock-screen probe, the sign-in time
;    Styles         shared text/hit-area options
;    Chrome         frame, title bar, tabs (A = Date page, B = TZ page)
;    Date page      calendar, clock, fields      (Hidden=#Page#)
;    TZ page        time-zone details            (Hidden=(1 - #Page#))
;    Usage panel    bottom strip, both pages
;    Hit areas      invisible click targets, topmost last
;    Month list     dropdown, drawn above everything
;
;  Performance: static meters carry UpdateDivider=-1 and are repainted only
;  when Skin.lua bangs the group they belong to (Calendar, Session, TimeZone,
;  MonthList) after a change.  Per-second work is just the clock hands, the two
;  time strings, and the Lua tick.
; ===========================================================================

[Rainmeter]
Update=1000
AccurateText=1
MouseActionCursor=0

[Metadata]
Name=Win98 Date/Time
Information=Pixel reconstruction of the Windows 98 Date/Time Properties dialog.|Month dropdown, clickable calendar, and a log of when this computer was on and unlocked.
Version=4.1
License=Do what you like with it

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole dialog, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextAA=0
TextDY=0

; --- clock -----------------------------------------------------------------
CX=289
CY=142
Use24Hour=1
; also toggled by the time spinner, which writes the new value back here
HideSeconds=0
HideRing=0

; --- calendar --------------------------------------------------------------
WeekStart=1
; 1 = Monday first, 0 = Sunday first

; --- usage log -------------------------------------------------------------
; how many days of history to keep in the log file (see README)
HistoryDays=31
; The hourly usage graph: one 3D block per hour of the window below, standing
; on a receding floor.  Skin.lua computes the blocks into the Bar* variables;
; the meter that draws the frame gives the interior eight more rows for the
; hour ruler.
BarX=29
BarY=293
BarW=322
BarH=40
; The graph covers these hours of the day rather than all 24.  The hour
; ruler and gridlines in the trough meter are drawn to match -- one tick
; centred under each block -- so change them together.
GraphFrom=7
GraphTo=21

; --- ui state --------------------------------------------------------------
; Page: 0 = Date & Time, 1 = Time Zone.  MLHide: 1 = month dropdown closed.
Page=0
MLHide=1
MLRow=0
MLBarOn=0

