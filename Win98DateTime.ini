[MeterUseBar]
; The hourly 3D blocks, written by Skin.lua: four shapes per hour slot, 24
; slots so any GraphFrom..GraphTo window up to the full day fits, and the
; thin "now" cursor drawn last, over everything.  A Path shape cannot hold
; its geometry inline -- the Shape line names an option of this meter that
; does -- so each of the three angled faces gets a B<slot><face> option that
; just points at its Bar* variable.  The fills stay here: they never change,
; only the geometry does.  Order within a slot matters -- silhouette, then
; front, side, top 1px inside it, so the ink shows through as outline and
