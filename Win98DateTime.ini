[MeterUseTrough]
; The graph's stage.  Everything about it that never changes is drawn here,
; framed with the same two-ring sunken edge as the time and year fields, so
; the interior is inset 2px on every side: #BarW# wide, #BarH# rows for the
; blocks, and the hour ruler in the 8 below them.  On the field:
;   - a dotted gridline every 15 minutes of an hour (rows 325/317/309/301:
;     a full-height block is 60 minutes, 8 rows per quarter at the default
;     geometry), so the blocks in the bar meter have something to measure by
;   - the floor the blocks stand on, receding 5 rows up-right to match DEPTH
;     in Skin.lua, its surface stippled with the classic 1px dither -- the
;     alternating phase comes free from each row starting 1px further left
;   - one tick per hour, centred under its block, full height every third
;     hour (the centres follow BarX + slot*23 + 9 at the default geometry)
; All of it is tied to the variables above and the constants in Skin.lua, so
; change them together.
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 27,291,326,52 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 27,291,326,1 | Fill Color #Shadow# | StrokeWidth 0
