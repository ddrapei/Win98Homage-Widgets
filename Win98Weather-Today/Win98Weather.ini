MeterStyle=StyleText
Group=Weather
X=(#Pad# + 90)
Y=(#Pad# + 116 + #TextDY#)
W=130
StringAlign=Center
FontColor=#Shadow#
ClipString=1
DynamicVariables=1
Text=#LocationLabel#

