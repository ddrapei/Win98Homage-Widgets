; ===========================================================================
;  Win98 Weather  --  Rainmeter skin  (v1.2)
;  Today's weather as a Win98 property-dialog panel: current temperature and
;  condition icon, location, and today's high/low in a sunken field.
;  Same warm golden / orange-brown scheme and chrome as the sibling widgets.
;  Skin.lua and the Icons folder must sit in this folder.
;
;  Structure:
;    Variables      palette, layout knobs, Lua-written state
;    Measures       IP geolocation (once a day), then Open-Meteo current + daily
;    Styles         shared text options
;    Chrome         frame, title bar, earth icon, title, buttons
;    Weather panel  one etched group box, legend on its edge -- the sibling's
;                   usage-panel treatment -- a centred column of icon, current
;                   temp, condition, location, and a sunken high/low field
;
;  Data flow: MeasureGeoIP resolves this machine's public IP location. Its one
;  RegExp captures city, lat and lon as StringIndex 1..3, and the three child
;  measures below it pick those out. Skin.lua copies lat/lon into #Lat#/#Lon#
;  and enables MeasureWeatherRaw, which downloads from Open-Meteo (no key
;  needed) and re-downloads every 30 minutes. Its own single RegExp captures
;  five values -- temperature, is_day, weather code, today's high and today's
;  low -- and again only child measures read them. Only the two parents touch
;  the network.
;
;  Note on WebParser: the capture groups must live on the *parent* measure. A
;  child's StringIndex selects one of the parent's groups; a RegExp on a child
;  would be applied to that group's text, not to the page. Splitting the work
;  into one RegExp per child leaves the parents with nothing to capture, and
;  every child then reads empty -- which is exactly how this skin used to fail.
;
;  Set ManualLat / ManualLon below to skip the IP lookup entirely.
; ===========================================================================

[Rainmeter]
Update=1000
AccurateText=1
MouseActionCursor=0

[Metadata]
Name=Win98 Weather
Information=Pixel reconstruction of a Windows 98 property dialog.|Today's temperature, condition and high/low, via Open-Meteo.
Version=1.2
License=Do what you like with it

[Variables]
; --- layout ----------------------------------------------------------------
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextAA=0
TextDY=0

; --- palette -----------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
UseInk=170,78,28

; --- icon palette ------------------------------------------------------------
; the title-bar earth is pixel art in the Win98 icon idiom, so it keeps that
; era's own colours rather than the warm chrome above -- the same flat VGA
; fills and hard black outline as the condition icons in the Icons folder
IcoOutline=0,0,0
IcoWhite=255,255,255
IcoRain=0,0,255
IcoRainDark=0,0,128
IcoIce=128,192,255
IcoLand=0,168,0

; --- location + units --------------------------------------------------------
; Lat/Lon start empty and are written once by Skin.lua when the IP lookup
; resolves. To pin the skin to one place instead -- or to keep it off
; ip-api.com altogether -- fill in ManualLat / ManualLon (decimal degrees) and
; optionally ManualLocation; the IP lookup is then never made at all.
; TempUnit is Open-Meteo's own unit name, so it drops straight into the
; request URL: celsius or fahrenheit.
Lat=
Lon=
ManualLat=
ManualLon=
ManualLocation=
TempUnit=celsius

; --- written by Skin.lua ----------------------------------------------------
; defaults read sensibly before the first fetch completes
TempNow=--
Condition=Loading...
HighLowText=--
LocationLabel=
; full path of the condition icon, one of the PNGs in the Icons folder. Empty
; until the first forecast arrives: an Image meter with no ImageName draws
; nothing.
IconFile=

[MeasureGeoIP]
; resolves this machine's public IP location, once a day -- so that a laptop
; that moves catches up without a refresh. One RegExp, three capture groups.
; http, not https: ip-api.com serves TLS to paying keys only.
Measure=WebParser
URL=http://ip-api.com/json/
RegExp=(?siU)"city":"(.*)",.*"lat":(.*),"lon":(.*),
UpdateRate=86400
CodePage=65001

[MeasureCity]
Measure=WebParser
URL=[MeasureGeoIP]
StringIndex=1

[MeasureLat]
Measure=WebParser
URL=[MeasureGeoIP]
StringIndex=2

[MeasureLon]
Measure=WebParser
URL=[MeasureGeoIP]
StringIndex=3

[MeasureWeatherRaw]
; the actual forecast. Starts disabled and holds an empty #Lat#/#Lon#, so no
; request is made until Skin.lua has real coordinates to put in the URL;
; DynamicVariables=1 is what lets it pick them up. Then it re-downloads every
; 30 minutes (Update x UpdateRate = 1000ms x 1800).
;
; The RegExp reads the current_weather block, then the daily block -- the
; anchor on "daily" matters, since daily_units carries the same key names and
; comes first. The two daily captures stop at the comma after the first array
; element (today), so keep at least two forecast days in the URL.
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=#TempUnit#&timezone=auto
RegExp=(?siU)"current_weather":.*"temperature":(.*),.*"is_day":(.*),.*"weathercode":(.*)\}.*"daily":.*"temperature_2m_max":.(.*),.*"temperature_2m_min":.(.*),
UpdateRate=1800
Flags=ForceReload
CodePage=65001
Disabled=1
DynamicVariables=1

[MeasureTempNow]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=1

[MeasureIsDay]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=2

[MeasureCodeNow]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=3

[MeasureTempMax]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=4

[MeasureTempMin]
Measure=WebParser
URL=[MeasureWeatherRaw]
StringIndex=5

[MeasureSkin]
Measure=Script
ScriptFile=#CURRENTPATH#Skin.lua

[StyleText]
; every string meter inherits this
FontFace=#Font#
FontSize=#FontSize#
FontColor=#Ink#
AntiAlias=#TextAA#
ClipString=0
UpdateDivider=-1
DynamicVariables=1

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 0,0,(180 + 2 * #Pad#),(180 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 0,0,180,180 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,180,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,180 | Fill Color #Light# | StrokeWidth 0
