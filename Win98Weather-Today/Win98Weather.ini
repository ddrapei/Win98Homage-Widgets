X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 16,30,147,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 16,30,1,132 | Fill Color #Shadow# | StrokeWidth 0
