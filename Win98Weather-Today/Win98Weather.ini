MeterStyle=StyleText
X=(#Pad# + 20)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=Today's Weather

[MeterIconWeather]
; the condition glyph: a 32x32 Win98-era icon from the Icons folder, picked
; by Skin.lua and repainted with the rest of the Weather group
Meter=Image
Group=Weather
X=(#Pad# + 74)
Y=(#Pad# + 40)
W=32
H=32
ImageName=#IconFile#
UpdateDivider=-1
DynamicVariables=1

[MeterTempNow]
Meter=String
MeterStyle=StyleText
Group=Weather
X=(#Pad# + 90)
Y=(#Pad# + 71 + #TextDY#)
StringAlign=Center
FontSize=20
StringStyle=Bold
DynamicVariables=1
Text=#TempNow#

[MeterCondition]
Meter=String
MeterStyle=StyleText
Group=Weather
X=(#Pad# + 90)
Y=(#Pad# + 101 + #TextDY#)
W=130
StringAlign=Center
ClipString=1
DynamicVariables=1
Text=#Condition#

[MeterLocation]
