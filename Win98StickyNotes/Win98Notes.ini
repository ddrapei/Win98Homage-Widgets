; ---- Scrollbar ------------------------------------------------------------

[MeterTrough]
; Win98 dithers a trough half face, half highlight; at this size the two
; average out to the palette's Light, so it is one flat rectangle.  A click
; in it pages towards the pointer, which is why the script is handed $MOUSEY$
; -- and, as on the paper above, that y is relative to this meter, so Page()
; adds #TroughY# back before comparing it with the thumb.
Meter=Shape
X=(#Pad# + #TroughX#)
Y=(#Pad# + #TroughY#)
UpdateDivider=-1
Shape=Rectangle 0,0,11,#TroughH# | Fill Color #Light# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureSkin "Page($MOUSEY$)"]

[MeterThumb]
; the moving part, written by Skin.lua -- and only its top and its height:
; the outset that makes it a thumb is static, drawn around the two numbers
Meter=Shape
X=(#Pad# + #TroughX#)
Y=#Pad#
Group=Note
UpdateDivider=-1
DynamicVariables=1
Shape=Rectangle 0,#ThumbY#,11,#ThumbH# | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,#ThumbY#,11,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,#ThumbY#,1,#ThumbH# | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,(#ThumbY# + #ThumbH# - 1),11,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 10,#ThumbY#,1,#ThumbH# | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,(#ThumbY# + 1),9,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,(#ThumbY# + 1),1,(#ThumbH# - 2) | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,(#ThumbY# + #ThumbH# - 2),9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 9,(#ThumbY# + 1),1,(#ThumbH# - 2) | Fill Color #Shadow# | StrokeWidth 0

[MeterBarUp]
; one row per click, the same as the wheel
Meter=Shape
MeterStyle=StyleArrow
