; ===========================================================================
;  Win98 Sticky Note  --  Rainmeter skin  (v7.2)
;  A Windows 98 note window: ruled paper in a sunken field, a real
;  scrollbar, checkboxes you can click, and lines you can type straight
;  into.  Sibling of the Win98 Resource Meter and Date/Time skins: same warm
;  golden / orange-brown chrome, half their width.  Skin.lua must sit in
;  this folder, and Notes.txt beside it is what the skin shows.
;
;  Structure:
;    Variables      palette, layout knobs, Lua-written state
;    Measures       the script, and the input box it puts over a line
;    Styles         shared text, button, checkbox and arrow options
;    Chrome         frame, title bar, icon, title, buttons
;    Paper          field bezel, margin rule, ruled lines
;    Scrollbar      trough, arrows, thumb
;    Rows           twelve rows: text, strike-through, checkbox, tick
;    Mouse          the one rectangle every click on the paper lands in
;    Status         two sunken panels at the foot: created, word count
;
;  Editing.  A click on the paper hands the whole note to one edit box the
;  size of the sheet.  That box is a real Windows edit control, so the
;  caret goes where you click, selection and shift-selection work, Delete
;  and Backspace delete, and Ctrl-C/V/Z are the ones you already know.
;  Enter commits and closes; CTRL-Enter starts a new line; Escape leaves
;  without writing.  What it holds is the file itself, brackets and all --
;  type "[ ] " in front of a line to make it an item, delete a line to
;  delete it.  A line beginning # is text like any other now: the window is
;  called Notes and nothing in the file changes that.
;
;  Saving.  A click outside the box no longer discards the edit -- see
;  FocusDismiss below -- so Enter and Escape are the only ways out.
;
;  Why Enter is not optional.  The plugin hands its text back
;  exactly once, when the box is submitted -- read PluginCode.cs and the
;  assignment is inside "if (input.ShowInputBox())", which is true only for
;  Enter.  Dismiss the box instead and the measure is not merely empty, it
;  still holds the text from the previous commit.  So there is no autosave
;  to be had here and no rescue on the way out: a script that committed on
;  dismissal would write the note back as it was *before* the edit and
;  report success.  This one does not try.  It says "not saved" in the right
;  panel instead, and keeps Notes.txt.bak one commit behind.
;
;  What that leaves is a contract worth making visible, so while the box is
;  open the right panel reads "Enter saves" rather than counting words
;  nobody is looking at.
;
;  Two more things the plugin will not do: the text arrives selected, so the
;  first click inside the box is what puts the caret down; and it will not
;  report where its caret is, which is why the foot of the window counts
;  words rather than pretending to follow the cursor.  One caveat from its
;  own manual: it cannot take the keyboard from a skin set to Stay Topmost,
;  so leave this on Normal.
;
;  Clicking.  Two meters report a mouse position -- [MeterPaper] for the
;  sheet and [MeterTrough] for the scrollbar -- and Rainmeter gives both of
;  them $MOUSEX$/$MOUSEY$ relative to THE METER, not to the skin.  Neither
;  meter sits at the skin's origin, so the script has to add the meter's own
;  corner back before the number means anything.  It does that from
;  #PaperX#/#PaperY# and #TroughY#, the same variables the meters are placed
;  with, so the two cannot hold different figures.  Nothing on the Lua side
;  touches #Pad#: it is already in the meters' X and Y, so Rainmeter has
;  subtracted it before the click arrives.  Getting this wrong is silent --
;  a wrong offset still picks a row, just not the one under the pointer --
;  which is what it did until v7.2.
;
;  The frame is 190 wide against the sibling's 380, which leaves the text
;  column 146 px -- about twenty-six characters.  Skin.lua wraps the file to
;  that column, hands twelve rows at a time to the meters below, and moves
;  the thumb.
;
;  Performance: all of it is static except five things per row (text, its
;  colour, the strike, the box, the tick), the thumb's two numbers and the
;  row count.  Nothing changes unless the file, the scroll offset, a
;  checkbox or the paper colour does, so a note nobody is touching costs
;  one small file read every other tick and no repaint at all.
; ===========================================================================

[Rainmeter]
Update=1000
AccurateText=1
MouseActionCursor=0
; the wheel scrolls anywhere over the skin, not just over the paper
MouseScrollUpAction=[!CommandMeasure MeasureSkin "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureSkin "Scroll(1)"]

[Metadata]
Name=Win98 Sticky Note
Information=Pixel reconstruction of a Windows 98 note window.|It shows Notes.txt from this folder: plain text wrapped to the column, and lines that start [ ] or [x] as checkboxes.|Click the paper to edit the whole note in place: Enter saves, CTRL-Enter starts a line, Escape leaves without saving (the panel will say so).  Click a checkbox to flip it.  The swatch button swaps the paper between canary and white.  Double-click the icon to open the file.
Version=4.1
License=Do what you like with it

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextAA=0
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the Win98 Resource Meter and Date/Time skins: change them
; together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208

; --- paper stock -----------------------------------------------------------
; The two papers the swatch button swaps between.  This is the only place
; they are written down -- Skin.lua reads them from here, and the input box
; is painted #NoteBg# too, so the swatch, the sheet and the sheet you type
; on cannot disagree.
; canary
Paper1=250,238,190
; white
Paper2=247,243,233

; the margin rule stays the same warm red on either paper, the way a printed
; margin does whatever shade the sheet is
NoteMargin=205,128,96

; --- note ------------------------------------------------------------------
; The file the skin shows, and the figures Skin.lua needs to lay it out:
; 12 rows starting at y 30, 13 px apart, each drawn from x 22 and wrapped to
; 146 px, with the scrollbar's trough running from y 40 for 136 px.  The static
; meters below are laid out from the same figures, so change them together.
NoteFile=Notes.txt
Rows=12
RowPitch=13
Row1Y=30
TextX=22
TextW=146
TroughX=171
TroughY=40
TroughH=136

; The sheet's own rectangle, and the reason it is written down here rather
; than inside the meter that draws it.  [MeterPaper] is the one thing in the
; skin that reports a mouse position, and $MOUSEX$/$MOUSEY$ arrive relative
; to the meter that took the click -- so whatever corner that meter is placed
; at, Skin.lua has to add back before it can say which row was clicked.  Both
; read it from here, so neither can be holding a different number from the
; other.  That is not a hypothetical: they did, and every checkbox in the note
; answered three rows above the pointer.
PaperX=8
PaperY=29
PaperW=163
PaperH=158

; where the title sits in the bar
TitleX=24
TitleY=6
TitleW=125

; --- remembered between runs -----------------------------------------------
; Skin.lua writes these two back into this file with !WriteKeyValue, so the
; note keeps its colour and its birthday across a refresh or a reboot.
; Created is blank until the first run stamps it; put any date you like
; here and the skin will show that instead.
Colour=1
Created=30 Jul 2026

; --- written by Skin.lua ---------------------------------------------------
; The defaults are an empty yellow note with a dead scrollbar: without the
; script the window reads blank, not broken.
NoteBg=250,238,190
; the right-hand panel: how many words the note runs to
Words=
; the thumb fills the trough and both arrows are grey -- Win98's way of
; saying there is nothing to scroll
ThumbY=40
ThumbH=136
UpInk=#Shadow#
DownInk=#Shadow#
; one row of text ...
Row1=
Row2=
Row3=
Row4=
Row5=
Row6=
Row7=
Row8=
Row9=
Row10=
Row11=
Row12=
; ... its colour: ink normally, shadow once the item is done ...
RowInk1=#Ink#
RowInk2=#Ink#
RowInk3=#Ink#
RowInk4=#Ink#
RowInk5=#Ink#
RowInk6=#Ink#
RowInk7=#Ink#
RowInk8=#Ink#
RowInk9=#Ink#
RowInk10=#Ink#
RowInk11=#Ink#
RowInk12=#Ink#
; ... whether its checkbox is hidden (1) or shown (0) ...
Box1=1
Box2=1
Box3=1
Box4=1
Box5=1
Box6=1
Box7=1
Box8=1
Box9=1
Box10=1
Box11=1
Box12=1
; ... the colour of its tick, transparent until the item is done ...
Tick1=0,0,0,0
Tick2=0,0,0,0
Tick3=0,0,0,0
Tick4=0,0,0,0
Tick5=0,0,0,0
Tick6=0,0,0,0
Tick7=0,0,0,0
Tick8=0,0,0,0
Tick9=0,0,0,0
Tick10=0,0,0,0
Tick11=0,0,0,0
Tick12=0,0,0,0
; ... and the line struck through it, if any
Strike1=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike2=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike3=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike4=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike5=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike6=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike7=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike8=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike9=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike10=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike11=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Strike12=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
; scratch: the input box needs one $UserInput$ somewhere to open at all,
; and this is where it lands.  Skin.lua reads the typed text off the
; measure itself instead, so a line with a quote in it survives the trip.
Typed=

[MeasureSkin]
; every other tick: the script re-reads Notes.txt and re-wraps it if the
; bytes changed.  Clicks, the wheel and the keyboard do not wait for it --
; they call into the script directly
Measure=Script
ScriptFile=#CURRENTPATH#Skin.lua
UpdateDivider=2

[MeasureInput]
; the one keyboard in the skin, and it only ever covers one thing: the
; sheet.  X/Y/W/H below ARE the paper's own figures -- pad + PaperX, pad +
; PaperY, PaperW, PaperH -- and SolidColor is #NoteBg#, the variable the
; paper itself is painted with.  Skin.lua sets the text and nothing else, so
; the box cannot open in the wrong place or the wrong colour.
;
; Command1 exists to hold the $UserInput$ the plugin needs in order to
; open a box at all -- the text it captures is read back off this measure
; in Commit(), which is the only route that survives a quote, a percent
; sign, or a line break.  The two commands are separate so that a value
; the bang parser chokes on cannot take Commit() down with it.
Measure=Plugin
Plugin=InputText
; The box sits wholly inside the paper, and that is the point of these four
; numbers.  The sheet is x 8..170 by y 29..186 of the frame; the box is
; x 21..169 by y 30..185 -- a pixel of paper above, below and to the right of
; it, and two to the left, where the margin rule runs down x 19.
;
; Nothing of the window's chrome is underneath it.  An earlier version put
; the top edge on y 28, one pixel into the field's own inner bevel, and that
; single dark line disappearing under the box is what made the sheet look as
; though it moved when you clicked in.  Sitting a pixel clear of everything,
; the box's own edges fall on paper of the same colour, so there is nothing
; to see when it opens: no line covered, no line revealed.
;
; The text still lands where the rows draw it.  An edit control insets its
; text a pixel or two, so a box starting at x 21 puts the first character on
; 22 or 23, against the row meters' 22.
;
; Written out rather than computed because a plugin measure parses its own
; options and formulas here are not worth the risk; if Pad, TextX or TextW
; change, change these to match.
X=33
Y=42
W=149
H=156
SolidColor=#NoteBg#
FontColor=#Ink#
FontFace=#Font#
FontSize=#FontSize#
StringAlign=Left
; FocusDismiss=0: a click outside the box no longer throws the edit away.
; Only Enter (saves) and Escape (does not) end the session now.
;
; This reverses an earlier note here that said 0 "disables the mouse
; entirely".  The manual's wording invites that reading, but InputBox.cs
; describes the flag only as dismissing the box when it loses cursor or
; window focus, which is a narrower thing.  Two effects to watch for, both
; from that ambiguity, because neither can be settled without Windows:
;
;   - if a click INSIDE the box no longer places the caret, the note is in
;     danger, because the plugin hands the text over fully selected and the
;     first keystroke would replace all of it.  Notes.txt.bak is written
;     before every commit and would still hold the note.
;   - other skins may stop taking clicks while the box is open.
;
; Either way the fix is one character: put this back to 1.
;
; TopMost=1 goes with it.  The manual only forbids TopMost while
; FocusDismiss is 1, so turning that off is what makes this available --
; and it earns its place, because a box that survives a click elsewhere
; would otherwise sit behind whatever was clicked, holding the only copy
; of the edit with nothing on screen to say so.  On top, it stays visible
; and plainly waiting.
FocusDismiss=0
TopMost=1
; a note is longer than a prompt; 0 is unlimited
InputLimit=0
DefaultValue=
Command1=[!SetVariable Typed "$UserInput$"]
Command2=[!CommandMeasure MeasureSkin "Commit()"]
OnDismissAction=[!CommandMeasure MeasureSkin "Dismiss()"]

[StyleText]
; every string meter inherits this
FontFace=#Font#
FontSize=#FontSize#
FontColor=#Ink#
AntiAlias=#TextAA#
ClipString=0
UpdateDivider=-1
DynamicVariables=1

[StyleRow]
; a row of the note.  Clipped to the column on purpose: Skin.lua measures
; text with a table of advance widths rather than asking the font, so a
; line it gets a pixel or two wrong ends in an ellipsis instead of painting
; over the scrollbar
Group=Note
X=(#Pad# + #TextX#)
W=#TextW#
H=13
ClipString=1

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0
UpdateDivider=-1

[StyleArrow]
; the 11x11 outset of a scrollbar arrow.  The glyph is left to the meter
; because its colour changes: ink while there is somewhere to go, shadow
; when there is not
Shape=Rectangle 0,0,11,11 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,11,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,11 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,10,11,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 10,0,1,11 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,9,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,9 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,9,9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 9,1,1,9 | Fill Color #Shadow# | StrokeWidth 0
Group=Note
UpdateDivider=-1
DynamicVariables=1

[StyleBox]
; a row's checkbox: 9x9, sunken, sitting out in the margin beside the
; text.  The margin is the one part of the paper the input box does not
; cover, so the script blanks the boxes and their ticks while the sheet is
; open -- the file's own "[ ]" is right there in the text being typed, and
; two of them would be one too many.  Nothing but drawing -- the click that
; flips it lands on [MeterPaper], which works out from $MOUSEX$ that it was
; over the margin and not the text.  Hidden=1 takes the box away, which is
; how a row that is not a checklist item shows nothing at all.
;
; Each meter draws its own tick, in Shape10..14 -- five 1px columns of
; #TickN#, transparent until the item is done.  They used to be one meter of
; their own holding all sixty rectangles in absolute coordinates, twelve
; ladders of y offsets to keep in step with this one.  Drawn here they are
; the same five offsets on every row, measured from the box they sit in, and
; Hidden takes the tick away with the box it belongs to rather than leaving
; it a chance to float on blank paper.
Group=Note
X=(#Pad# + 9)
UpdateDivider=-1
DynamicVariables=1
Shape=Rectangle 0,1,9,9 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 0,1,9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 0,1,1,9 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 0,9,9,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 8,1,1,9 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 1,2,7,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 1,2,1,7 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 1,8,7,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 7,2,1,7 | Fill Color #Light# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(220 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 0,0,190,220 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,220 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,219,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,220 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,218 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,218,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,218 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a note torn off a pad: an inked page of #IconFace# with three ruled lines
; and a dog-eared corner.  Drawn on x 6..16, y 4..15 like the siblings'
; icons, and nudged the same +2 right and +2 down so its 12 rows sit
; centered in the bar's 18.  Double-click opens the file, for the edits
; that are easier in a text editor.  No tooltip on it, or on anything else
; here: nothing in this skin explains itself on hover.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
UpdateDivider=-1
Shape=Rectangle 6,4,11,12 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 7,5,9,10 | Fill Color #IconFace# | StrokeWidth 0
Shape3=Rectangle 8,7,7,1 | Fill Color #Accent2# | StrokeWidth 0
Shape4=Rectangle 8,9,7,1 | Fill Color #Accent2# | StrokeWidth 0
Shape5=Rectangle 8,11,5,1 | Fill Color #Accent2# | StrokeWidth 0
Shape6=Rectangle 15,13,2,1 | Fill Color #Face# | StrokeWidth 0
Shape7=Rectangle 14,14,3,1 | Fill Color #Face# | StrokeWidth 0
Shape8=Rectangle 13,15,4,1 | Fill Color #Face# | StrokeWidth 0
Shape9=Rectangle 14,13,1,1 | Fill Color #Ink# | StrokeWidth 0
Shape10=Rectangle 13,14,1,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseDoubleClickAction=["#CURRENTPATH##NoteFile#"]

[MeterTitle]
; the window's name.  It is the word Notes and nothing else -- not the file's
; first line, not anything a click can change -- so it carries no mouse
; action at all, and the whole bar drags the window the way a Win98 title bar
; should.
Meter=String
MeterStyle=StyleText
X=(#Pad# + #TitleX#)
Y=(#Pad# + #TitleY# + #TextDY#)
W=#TitleW#
H=13
ClipString=1
FontColor=#TitleInk#
StringStyle=Bold
Text=Notes

[MeterBtnPaper]
; the paper colour, shown as a picture of the note itself rather than as a
; plain swatch: an inked 8x8 window with one row of #TitleB# title bar
; across the top and five of #NoteBg# paper under it.  So the button is a
; small copy of the thing it changes, and it still answers the only
; question it is there to answer -- what colour is the paper -- because
; five of its eight rows are that colour.  A click swaps it for the other.
;
; It sits at x 4, y 3 of the 16x14, which leaves 4 px of face either side
; and 3 above and below: equal margins on both axes.  Shape1..9 are the
; button's own bevel and come from [StyleButton]; everything here is
; inside it and touches none of it.
Meter=Shape
MeterStyle=StyleButton
Group=Paper
DynamicVariables=1
X=(#Pad# + 151)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,8,8 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,6,1 | Fill Color #TitleB# | StrokeWidth 0
Shape12=Rectangle 5,5,6,5 | Fill Color #NoteBg# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureSkin "NextPaper()"]

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 170)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=[!DeactivateConfig]

; ---- Paper ----------------------------------------------------------------
; Both meters are in the Paper group and read #NoteBg# dynamically, which is
; how the swatch button recolours the sheet without a refresh.  UpdateDivider=-1 means they still cost nothing per tick: they
; are only ever re-read when the group is told to update.

[MeterField]
; the same two-ring sunken edge as the siblings' fields (2px per side), so
; the paper is 8..181 x 29..186
Meter=Shape
X=#Pad#
Y=#Pad#
Group=Paper
UpdateDivider=-1
DynamicVariables=1
Shape=Rectangle 6,27,178,162 | Fill Color #NoteBg# | StrokeWidth 0
Shape2=Rectangle 6,27,178,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,27,1,162 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,188,178,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 183,27,1,162 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,28,176,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,28,1,160 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,187,176,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 182,28,1,160 | Fill Color #Light# | StrokeWidth 0

[MeterMargin]
; the paper's printing, and all that is left of it: one margin rule down the
; left, at x 19, with the checkboxes sitting in the margin beside it.
;
; The ruled lines that used to run under every row are gone, and they had to
; go.  An input box is a Windows control that paints its own rectangle over
; the skin -- nothing drawn underneath survives while it is open, and its
; background can only be a flat colour.  So a ruled sheet could not stay
; ruled while it was being typed on: the lines vanished on the way in and
; came back on the way out.  A plain sheet looks the same either way, which
; is worth more than the lines were.
;
; The margin rule survives because the box no longer covers it: it stops at
; x 20, where the text column starts.
Meter=Shape
X=#Pad#
Y=#Pad#
Group=Paper
