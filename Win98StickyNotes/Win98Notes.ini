; ---- Mouse ----------------------------------------------------------------

[MeterPaper]
; One transparent rectangle over the whole sheet, x 8..170 -- everything
; left of the scrollbar and nothing under it.  Every click on the paper
; lands here and is handed to the script as a coordinate pair, which divides
; it up: left of x 22 is the margin, so flip that row's checkbox; right of
; it is the text, so open the sheet.
;
; One meter instead of twenty-four (a hit area per row, twice over), and the
; rule about which half of a row does what is written once, in Lua, where it
; can be read.  It sits below the flyout on purpose, so a click on a swatch
; is a click on a swatch.
;
; The pair handed over is relative to THIS METER, not to the skin -- that is
; how Rainmeter's mouse variables work, and it is the whole of what there is
; to get wrong here.  Click() adds #PaperX#/#PaperY# back, which is why they
; are variables up in [Variables] and why X and Y below are built from them
; rather than written out: the meter's corner and the script's idea of the
; meter's corner are then the same two numbers, read from one place.
;
; Note what this does NOT need.  #Pad# is in X and Y, so Rainmeter has already
; taken it off by the time the click arrives, and the script never sees it.
; If you find yourself adding or subtracting Pad on the Lua side, that is the
; bug: it cancels.
Meter=Shape
X=(#Pad# + #PaperX#)
Y=(#Pad# + #PaperY#)
UpdateDivider=-1
Shape=Rectangle 0,0,#PaperW#,#PaperH# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureSkin "Click($MOUSEX$,$MOUSEY$)"]

; ---- Status ---------------------------------------------------------------

[MeterStatusBar]
; two panels, sunken a single ring the way a Win98 status bar is, and the
; same size as each other: 88 px each, from x 6 to x 183 with 2 px between
; them.  178 does not halve evenly, so the gap takes the odd pixel rather
; than one panel being a pixel wider than the other.
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 6,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 6,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 93,195,1,16 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 96,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape7=Rectangle 96,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape8=Rectangle 96,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 96,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape10=Rectangle 183,195,1,16 | Fill Color #Hilite# | StrokeWidth 0

[MeterCreated]
; when the note was started: #Created#, which the first run stamps into the
; [Variables] block above and every run after that just reads.
;
; The word "Created" is not shown.  Both panels are 88 px wide, which
; leaves 82 for text, and "Created 30 Jul 2026" wants 96 of it -- so the
; label would have pushed the date itself into an ellipsis.  A bare date
; beside a bare count is the more Win98 pairing anyway.  It was on a
; tooltip for a while; nothing in this skin explains itself on hover, so
; it isn't any more.
Meter=String
MeterStyle=StyleText
Group=Note
X=(#Pad# + 9)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
Text=#Created#

[MeterWords]
; how many words the note runs to -- and where the script says so if it
; could not write the file, cannot find it, or is holding text that has
; not been saved yet.
Meter=String
MeterStyle=StyleText
Group=Note
X=(#Pad# + 181)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
StringAlign=Right
Text=#Words#
