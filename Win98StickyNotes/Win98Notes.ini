; ---- Mouse ----------------------------------------------------------------

[MeterPaper]
; One transparent rectangle over the whole sheet, x 8..170 -- everything
; left of the scrollbar and nothing under it.  Every click on the paper
; lands here and is handed to the script as a coordinate pair, which
; divides it up: left of x 22 is the margin, so flip that row's checkbox;
; right of it is the text, so note the line and column and open the sheet.
;
; One meter instead of twenty-four (a hit area per row, twice over), and
; the rule about which half of a row does what is written once, in Lua,
; where it can be read.  It sits below the flyout on purpose, so a click
; on a swatch is a click on a swatch.
Meter=Shape
X=(#Pad# + 8)
Y=(#Pad# + 29)
UpdateDivider=-1
Shape=Rectangle 0,0,163,158 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureSkin "Click($MOUSEX$,$MOUSEY$)"]

; ---- Status ---------------------------------------------------------------

[MeterStatusBar]
; two panels, sunken a single ring the way a Win98 status bar is, and the
; same size as each other: 88 px each, from x 6 to x 183 with 2 px between
; them.  178 does not halve evenly, so the gap takes the odd pixel rather
; than one panel being a pixel wider than the other.
Meter=Shape
X=#Pad#
Y=#Pad#
UpdateDivider=-1
Shape=Rectangle 6,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 6,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 93,195,1,16 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 96,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape7=Rectangle 96,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape8=Rectangle 96,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 96,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape10=Rectangle 183,195,1,16 | Fill Color #Hilite# | StrokeWidth 0

[MeterCreated]
; when the note was started: #Created#, which the first run stamps into the
; [Variables] block above and every run after that just reads.
;
; The word "Created" has moved to the tooltip.  Both panels are 88 px wide
; now, which leaves 82 for text, and "Created 30 Jul 2026" wants 96 of it --
; so the label would have pushed the date itself into an ellipsis.  A bare
; date beside a bare count is the more Win98 pairing anyway.
Meter=String
MeterStyle=StyleText
Group=Note
X=(#Pad# + 9)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
ToolTipText=Created
Text=#Created#

[MeterWords]
; how many words the note runs to -- and where the script says so if it
; could not write the file, cannot find it, or is holding text that has
; not been saved yet.
Meter=String
MeterStyle=StyleText
Group=Note
X=(#Pad# + 181)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
StringAlign=Right
Text=#Words#
